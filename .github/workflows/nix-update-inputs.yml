name: Update Nix Dependencies

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  nix-flake-update:
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:      
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: DeterminateSystems/determinate-nix-action@4b040423529d49b1a19ba918742e0aa9aa95031a
      - uses: DeterminateSystems/update-flake-lock@a6b01882e9290a55d390f352ff11664ceea1661a
        with:
          pr-title: "chore(nix): update flake inputs"
          pr-labels: |
            dependencies
            automated